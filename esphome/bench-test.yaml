# Banc d'essai S21 sur ESP32 ordinaire. À ADAPTER (broches, secrets).
# Lecture d'abord; ne pas écrire de commandes avant d'avoir validé les lectures.
esphome:
  name: s21-bench

esp32:
  board: esp32dev

logger:
  level: DEBUG
  baud_rate: 0        # libère l'UART0; logs via Wi-Fi/API

api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://joshbenner/esphome-daikin-s21@main
    components: [daikin_s21]

uart:
  - id: s21_uart
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 2400
    data_bits: 8
    parity: EVEN
    stop_bits: 2

daikin_s21:
  tx_uart: s21_uart
  rx_uart: s21_uart

climate:
  - platform: daikin_s21
    name: "Thermopompe (banc)"
